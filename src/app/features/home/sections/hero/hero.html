<div class="hero__section" id="hero">
  <div class="bg-hero">
    <img class="hero_ellipse" src="images/hero/ellipse_3.png" alt="" />
    <img class="hero_photo" src="images/hero/photo.png" alt="profile" />

    <div class="hero-overlay">
      <div class="hero-content">
        <h4 class="hero-name">
          {{ 'hero.name' | transloco }}
        </h4>

        <h1 class="hero-title">
          {{ 'hero.titleFrontend' | transloco }} <br />
          {{ 'hero.titleDeveloper' | transloco }}
        </h1>
      </div>
    </div>

    <div class="hero-bottom">
      <div class="scroll__down" *ngIf="!menuOpen">
        <a href="#footer">
          <img src="/images/mobile/scroll_down.png" alt="" />
        </a>
      </div>

      <div class="disktop_menu">
        <div class="scroll_line">
          <p>{{ 'hero.scroll' | transloco }}</p>
          <img src="images/hero/line.png" alt="line" />
        </div>

        <div class="social-icons">
          <a href="https://github.com/EidAden" target="_blank" rel="noopener noreferrer">
            <img src="images/hero/github.png" alt="github" class="github-icon" />
          </a>

          <a href="mailto:eiddev24@gmail.com">
            <img src="images/hero/email.png" alt="email" class="email-icon" />
          </a>

          <a
            href="https://www.linkedin.com/in/eid-aden-369b50147/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/hero/link.png" alt="linkedin" class="linkedin-icon" />
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
