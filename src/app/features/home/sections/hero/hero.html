<div class="hero__section" id="hero">
  <div class="hero-wrapper">
    <div class="bg-hero">
      <div class="hero_ellipse" aria-hidden="true"></div>

      <img class="hero_photo" src="images/hero/photo.png" alt="Profile of Eid Aden" />

      <div class="hero-overlay">
        <div class="hero-content">
          <h4 class="hero-name">
            {{ 'hero.name' | transloco }}
          </h4>

          <h1 class="hero-title">
            {{ 'hero.titleFrontend' | transloco }} <br />
            {{ 'hero.titleDeveloper' | transloco }}
          </h1>
        </div>

        <!-- TestContent -->
        <div class="hero-bottom">
          <div class="scroll__down">
            <a href="#footer" aria-label="Scroll to footer">
              <img src="/images/mobile/scroll_down.png" alt="" />
            </a>
          </div>

          <div class="desktop-menu">
            <div class="scroll-indicator">
              <span>{{ 'hero.scroll' | transloco }}</span>
              <div class="scroll-line" aria-hidden="true"></div>
            </div>

            <div class="social-icons">
              <a
                href="https://github.com/EidAden"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit my GitHub profile"
              >
                <span class="icon-box">
                  <img
                    src="images/hero/github.png"
                    alt=""
                    class="social-icon social-icon--github"
                  />
                </span>
              </a>

              <a href="mailto:eiddev24@gmail.com" aria-label="Send me an email">
                <span class="icon-box">
                  <img src="images/hero/email.png" alt="" class="social-icon social-icon--email" />
                </span>
              </a>

              <a
                href="https://www.linkedin.com/in/eid-aden-369b50147/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit my LinkedIn profile"
              >
                <span class="icon-box">
                  <img
                    src="images/hero/link.png"
                    alt=""
                    class="social-icon social-icon--linkedin"
                  />
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
